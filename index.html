const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bold = s => esc(s).split(esc(SITE.authorName)).join("<b>" + esc(SITE.authorName) + "</b>");
const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`;
const has = a => Array.isArray(a) && a.length > 0;
const sections = [];
const add = (id, label, html, nav = true) => sections.push({ id, label, html, nav });

document.getElementById("tag").innerHTML = esc(SITE.tagline).replace(/, /g, ",<br>");

}

if (has(HIGHLIGHTS)) add("honours", "Honours", `<p class="kicker">Recognition</p><h2>Selected honours and milestones.</h2><div class="grid">${HIGHLIGHTS.map(h => `<div class="card"><span class="yr">${esc(h.year)}</span><h3>${esc(h.title)}</h3><p>${esc(h.place)}</p></div>`).join("")}</div>`, false);

if (has(SKILLS)) cv += `<h3 class="sub">Technical skills</h3><div class="grid">${SKILLS.map(i => `<div class="card"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join("")}</div>` + (has(TOOLKIT) ? `<div class="chips">${TOOLKIT.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : "");
if (has(TALKS)) cv += `<h3 class="sub">Conferences and invited talks</h3>` + list(TALKS);

/* Gallery behaviour: filters + lightbox */
(function () {
  const gal = document.getElementById("gal");
  if (!gal) return;
  const full = g => g.file.includes(".") ? g.file : `gallery/${g.file}.jpg`;
  const thumb = g => g.thumb || (g.file.includes(".") ? g.file : `gallery/thumbs/${g.file}.jpg`);
  let shown = GALLERY.slice(), idx = 0, cat = "";
  let ncols = 0;
  const cols = () => gal.clientWidth >= 860 ? 4 : gal.clientWidth >= 560 ? 3 : 2;
  function draw() {
    shown = GALLERY.filter(g => !cat || g.cat === cat);
    ncols = cols();
    const heights = Array(ncols).fill(0), out = Array.from({ length: ncols }, () => "");
    shown.forEach((g, i) => {
      let c = heights.indexOf(Math.min(...heights));
      heights[c] += g.w ? g.h / g.w : .75;
      out[c] += `<figure style="animation-delay:${Math.min(i, 12) * 40}ms"><button type="button" data-i="${i}" aria-label="Open photo: ${esc(g.title || g.caption)}"><img src="${esc(thumb(g))}" ${g.w ? `width="${g.w}" height="${g.h}"` : ""} alt="${esc(g.title || g.caption)}" loading="lazy" decoding="async"></button><figcaption><b>${esc(g.title)}</b><span>${esc(g.caption || "")}</span></figcaption></figure>`;
    });
    gal.innerHTML = out.map(h => `<div class="gcol">${h}</div>`).join("");
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (cols() !== ncols) draw(); }, 150); });
  document.querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => {
    cat = b.dataset.cat;
    document.querySelectorAll(".fbtn").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw();
  }));
  draw();

  const lb = document.createElement("div");
  lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true"); lb.setAttribute("aria-label", "Photo viewer");
  lb.innerHTML = `<button class="lb-b lb-x" aria-label="Close">×</button><button class="lb-b lb-p" aria-label="Previous photo">‹</button><button class="lb-b lb-n" aria-label="Next photo">›</button><div class="lb-in"><img alt=""><div class="lb-cap"><b></b><span></span><small></small></div></div>`;
  document.body.appendChild(lb);
  const im = lb.querySelector("img"), $ = s => lb.querySelector(s);
  let opener = null;
  function show(i) {
    idx = (i + shown.length) % shown.length;
    const g = shown[idx];
    im.src = full(g); im.alt = g.title || g.caption || "";
    $(".lb-cap b").textContent = g.title || "";
    $(".lb-cap span").textContent = g.caption || "";
    $(".lb-cap small").textContent = (idx + 1) + " / " + shown.length;
    [idx + 1, idx - 1].forEach(j => { const n = shown[(j + shown.length) % shown.length]; if (n) new Image().src = full(n); });
  }
  function open(i) { opener = document.activeElement; show(i); lb.classList.add("open"); document.body.style.overflow = "hidden"; $(".lb-x").focus(); }
  function close() { lb.classList.remove("open"); document.body.style.overflow = ""; im.removeAttribute("src"); if (opener) opener.focus(); }
  gal.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) open(+b.dataset.i); });
  $(".lb-x").onclick = close; $(".lb-p").onclick = () => show(idx - 1); $(".lb-n").onclick = () => show(idx + 1);
  lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-in")) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(idx - 1);
    else if (e.key === "ArrowRight") show(idx + 1);
    else if (e.key === "Tab") { const f = [...lb.querySelectorAll("button")]; const k = f.indexOf(document.activeElement); e.preventDefault(); f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
  });
  let sx = null;
  lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1)); }, { passive: true });
})();

/* Highlight the menu link of the section being read */
if ("IntersectionObserver" in window) {
  const links = [...document.querySelectorAll("nav a")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("main section").forEach(s => spy.observe(s));
}

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll("main section").forEach(el => { el.classList.add("reveal"); io.observe(el); });
}

const ph = document.getElementById("photo");
if (ph) ph.addEventListener("error", () => { ph.remove(); document.getElementById("heroin").classList.add("nophoto"); });
