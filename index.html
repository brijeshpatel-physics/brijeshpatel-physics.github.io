<style>
:root{--bg:#ebe7df;--ink:#0f2e26;--green:#0f2e26;--on-green:#f1ead9;--muted:#4b5f58;--accent:#b8553f;--card:#f6f3ec;--line:#c9c3b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16201d;--ink:#ece6d8;--muted:#a9b5af;--accent:#e08a70;--card:#1e2b27;--line:#33423d;--green:#0b1f19}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:1.7}
h1,h2,h3,.brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 5vw;flex-wrap:wrap}
.brand{font-size:1.4rem;color:var(--accent);font-weight:600;text-decoration:none}
.tag{font-family:"Cormorant Garamond",Georgia,serif;font-size:.95rem;line-height:1.3;letter-spacing:.04em;color:var(--accent);margin-top:4px;display:none}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:.92rem}
nav a:hover{color:var(--accent)}
.hero{background:linear-gradient(to bottom,var(--bg) 0,var(--bg) 90px,var(--green) 90px);padding:0 5vw 70px}
.hero-in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:28px;padding-top:40px}
.photo{width:100%;max-width:260px;aspect-ratio:33/40;object-fit:cover;object-position:70% 20%;display:block;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.hero-text{color:var(--on-green)}
.hero h1{font-size:clamp(2.8rem,7vw,4.4rem);color:#e3846b;line-height:1.05;margin-bottom:14px}
.creds{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;letter-spacing:.04em;line-height:1.5;color:#e9c98a;margin-bottom:22px}
.hero p{margin:0 0 12px;max-width:62ch}
section{max-width:1060px;margin:0 auto;padding:80px 5vw}
h2{font-size:2.3rem;color:var(--accent);margin-bottom:26px}
.sub{font-size:1.6rem;margin:38px 0 10px}
.lead{max-width:64ch;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:10px}
.card{background:var(--card);border-left:4px solid var(--accent);padding:22px 24px}
.card h3{font-size:1.45rem;margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:.96rem}
.row{display:grid;grid-template-columns:1fr;gap:2px;padding:14px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted)}
.yr{font-family:"Cormorant Garamond",serif;font-size:1.2rem;color:var(--accent)}
.list{margin:0;padding-left:1.1em;max-width:78ch}
.list li{margin:8px 0}
.pub{border-top:1px solid var(--line);padding:18px 0}
.pub span{color:var(--muted);display:block;font-size:.92rem}
.pub b{font-weight:600}
.pub a,.lead a,.contact a{color:var(--accent)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--card)}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--green),#25584a);display:flex;align-items:center;justify-content:center;color:#f1ead9;font-family:"Cormorant Garamond",serif;font-size:1.25rem;text-align:center;padding:8px}
.gal figcaption{font-size:.9rem;color:var(--muted);padding-top:8px}
footer{border-top:1px solid var(--line);text-align:center;padding:26px 5vw;color:var(--muted);font-size:.88rem}
@media (min-width:761px){
 .tag{display:block}
 .hero{background:linear-gradient(to bottom,var(--bg) 0,var(--bg) 170px,var(--green) 170px);padding-bottom:110px}
 .hero-in{grid-template-columns:minmax(300px,400px) 1fr;gap:56px;align-items:stretch;padding-top:70px}
 .hero-in.nophoto{grid-template-columns:1fr}
 .photo{max-width:none;height:100%;aspect-ratio:auto}
 .hero-text{padding-top:110px}
 .hero h1{margin-bottom:18px}
 .creds{margin:0 0 24px 40px;font-size:1.05rem;font-variant:small-caps;letter-spacing:.08em;line-height:1.6}
 .hero p{font-family:"Cormorant Garamond",Georgia,serif;font-variant:small-caps;letter-spacing:.08em;text-align:justify;font-size:.98rem;line-height:1.55;max-width:none}
 .row{grid-template-columns:120px 1fr;gap:18px}
}

<script>
/* =====================================================================
   CONTENT  —  edit only this block. Keep the quotes, commas and brackets.
   ===================================================================== */
const SITE = {
  name: "Brijesh Kumar Patel",
  heading: "Brijesh Patel",
  tagline: "PhD Physics, Tata Institute of Fundamental Research, Hyderabad",
  email: "brijeshpatel@tifrh.res.in",
  scholar: "https://scholar.google.com/citations?user=GrSPwfQAAAAJ",
  authorName: "Brijesh K. Patel",              // shown in bold inside author lists
  photo: "profile.jpg",
  photoAlt: "Portrait of Brijesh Patel speaking into a microphone",
  credentials: [
    "B.Tech Electrical Engg., NIT Raipur",
    "PhD Physics, TIFR Hyderabad"
  ],
  intro: [
    "I am an electrical engineer with a deep-rooted passion for the core principles of my field. During my undergraduate years, I was particularly drawn to electrical machines, generators, and transformers—systems that embody the beauty of classical electromagnetism and energy conversion.",
    "Over time, my curiosity has expanded toward the more fundamental realms of science, especially light–matter interactions, the electronic and optical properties of optoelectronic materials, and spectroscopy. This evolving interest reflects my desire to bridge applied engineering with foundational science, aiming to understand not only how systems work, but why they behave the way they do."
  ]
};

const RESEARCH = {
  text: "My PhD research focuses on the optical and electronic properties of organic semiconductors, perovskites and 2D materials, studied through spectroscopy, electrical characterization and charge transport. In organic electronics, I developed adduct-based dopants that suppress ion migration and enable high-performance optoelectronic devices. I also studied how the counter-anion sets the density of states, mobility, carrier density and polaron formation, which in turn govern charge localization and transport.",
  interests: [
    { title: "Doping of organic semiconductors", text: "Adduct-based p-type dopants that suppress ion migration and improve device performance." },
    { title: "Charge transport and polarons", text: "How counter-anions shape mobility, carrier density and charge localization." },
    { title: "Light–matter spectroscopy", text: "Optical and electronic properties of organic, perovskite and 2D materials." }
  ]
};

const EDUCATION = [
  { years: "2021–2026", degree: "Ph.D. in Physics", place: "Tata Institute of Fundamental Research, Hyderabad", score: "86.00%" },
  { years: "2018–2021", degree: "M.Sc. in Physics", place: "Tata Institute of Fundamental Research, Hyderabad", score: "78.00%" },
  { years: "2012–2016", degree: "B.Tech in Electrical Engineering", place: "National Institute of Technology, Raipur", score: "73.90%" },
  { years: "2010–2011", degree: "Higher Secondary (12th)", place: "H.S.M. Global Public School, Bilaspur, Chhattisgarh", score: "91.40%" },
  { years: "2008–2009", degree: "High School (10th)", place: "P.S.M. Sondka, Chhattisgarh", score: "93.16%" }
];

const SKILLS = [
  { title: "Electrical characterization", text: "Conductivity, Hall measurement, SCLC, transistor characterization, RLC circuit modeling, Mott-Schottky analysis." },
  { title: "Spectroscopy and microscopy", text: "XPS, transient absorption, Raman, IR, absorption, photoluminescence, time-resolved PL, impedance spectroscopy, Kelvin probe, AFM, SEM." },
  { title: "Fabrication and code", text: "Thin film deposition, lithography, and Python for data analysis and Matplotlib." }
];

const TALKS = [
  "Invited talk, International Conference on Advanced Materials, Energy & Environmental Sustainability (AMEES-2025), IIT Bhubaneswar",
  "Poster, Conference on Advancements in Renewable Energies (CARE-2026), TIFR Hyderabad (Best Poster Award)",
  "Poster, International Conference on Halide Perovskites (HyPe-2026), JNCASR Bengaluru",
  "Poster, International Conference on Metal Halide Perovskites (HyPe-2024), NISER Bhubaneswar",
  "Poster, In-house Symposium 2022, TIFR Hyderabad",
  "Attendee, CARE-2023, Harish-Chandra Research Institute, Prayagraj",
  "Attendee, 1st International Online Conference on Optics 2026",
  "Participant, 1st Department of Atomic Energy (DAE) Conclave 2025"
];

const AWARDS = [
  "Best Poster Award, CARE-2026",
  "Senior Electrical Engineer, Adani Power Limited (electrical generator operations)",
  "GATE 99.46 percentile; cleared Indian Engineering Services (IES) prelims",
  "Selected as Assistant Electrical Engineer at Power Grid Corporation of India and at Airports Authority of India",
  "Selected through Staff Selection Commission (SSC) for a Central Government technical post",
  "District topper; top 10 in the state board examinations"
];

const OUTREACH = [
  "Active member of TIFR Outreach, teaching science and mathematics to school students",
  "Played the All India Inter-NIT Cricket Tournament"
];

/* PUBLICATIONS: each group has a title and a list of items.
   Every item needs "title"; "authors", "journal", "detail" and "link" are optional. */
const PUBLICATIONS = [
  { group: "Peer-reviewed", items: [
    { title: "In-situ Regenerative Adduct Assisted p-Type Doping of Organic Semiconductors", authors: "Brijesh K. Patel, Arya Vidhan, Shubham Gupta, Vaishali Arunachalam, Simantini Nayak, Shaibal K. Sarkar, Pabitra K. Nayak", journal: "Advanced Materials", detail: "e73351 (2026)", link: "https://doi.org/10.1002/adma.73351" },
    { title: "The state of the art in photovoltaic materials and device research", authors: "Thomas Kirchartz, Genghua Yan, Ye Yuan, Brijesh K. Patel, David Cahen, Pabitra K. Nayak", journal: "Nature Reviews Materials", detail: "10, 335–354 (2025)", link: "https://doi.org/10.1038/s41578-025-00784-4" },
    { title: "Tuning and Understanding of Layered 2D MoS2–MoO3 Interface for Enhanced Photocatalytic Activities", authors: "S. Mallick, M. Jena, B. Das, B. Mohanty, Brijesh K. Patel, D.P. Das, A. Rath", journal: "Advanced Functional Materials", detail: "35, 2422645 (2025)", link: "https://doi.org/10.1002/adfm.202422645" },
    { title: "Charge Transport Dynamics in Doped Organic Polymers", authors: "Chandan Pramanik, Shubham Gupta, Sanyam Sharma, Brijesh K. Patel, Anirban Mondal, Pabitra K. Nayak, K.S. Narayan", journal: "Advanced Functional Materials", detail: "e78579", link: "https://doi.org/10.1002/adfm.78579" },
    { title: "Ion-Bound Polaronic Excitations in Doped P3HT", authors: "Dipin Kumar Tomar, Anil Kumar, Brijesh K. Patel, Shubham Gupta, Pabitra K. Nayak, Jyotishman Dasgupta", journal: "Journal of Physical Chemistry C", detail: "129, 51, 22650–22658 (2025)", link: "https://doi.org/10.1021/acs.jpcc.5c07231" }
  ]},
  { group: "Under review / preprint", items: [
    { title: "Bi-Functional Organic Salts for Ambient Processing of Organic Semiconductors", authors: "Brijesh K. Patel, Shubham Gupta, Satyabrata Sahoo, Chandan Gupta, Sudip De, Girish Mishra, Soumya Ghosh, Simantini Nayak, Pabitra K. Nayak", journal: "ChemRxiv", link: "https://doi.org/10.26434/chemrxiv.10001537/v1" },
    { title: "Split-Functional p-Type Dopants for Organic Semiconductors", authors: "Shubham Gupta, Rajat Sharma, Brijesh K. Patel, Chandan Pramanik, Shreya Pandit, Girish Mishra, Sudip De, Soumya Pattnaik, Soumya Ghosh, K.S. Narayan, Shaibal K. Sarkar, Pabitra K. Nayak", journal: "ChemRxiv", link: "https://doi.org/10.26434/chemrxiv.15002575/v1" }
  ]},
  { group: "Patents", items: [
    { title: "Sublimable Compounds, Process for their Preparation and Applications Thereof", detail: "International patent, publication number WO2026/120623" },
    { title: "Dopants Methods and Use Thereof", detail: "Indian patent application 202641000172" }
  ]},
  { group: "Book chapter", items: [
    { title: "Next-Generation Soft Semiconductor Materials and Devices: From Molecular Design to Scalable Optoelectronics", detail: "Chapter 12, Proceedings of the 2nd DAE Conclave (DAEC2026), Mumbai, 14–18 January 2026. Springer Nature, ISBN 978-981-92-2948-2" }
  ]},
  { group: "Master’s thesis", items: [
    { title: "Experimental Setup for X-ray Generation by Interaction of Laser Pulses with µ-Droplets", detail: "Advisor: M. Krishnamurthy, TIFR Hyderabad" },
    { title: "Nanoscale-Mesoscopic Optoelectronic Device Fabrication using Photolithography", detail: "Advisor: Pabitra K. Nayak, TIFR Hyderabad" },
    { title: "Experimental Setup for Dynamic Response of MoS2–HDABiI5 Heterostructures", detail: "Advisor: Pabitra K. Nayak, TIFR Hyderabad" }
  ]}
];

/* GALLERY: each line is one tile. Without a "file" it shows a green placeholder.
   To add a real photo, upload it next to index.html and add  file: "name.jpg"
   to that line, for example:  { file: "lab.jpg", title: "In the lab", ... }
   Delete all lines (leave []) to hide the gallery.                              */
const GALLERY = [
  { title: "Conference talks", caption: "Invited talk and poster sessions" },
  { title: "Best Poster Award", caption: "CARE-2026, TIFR Hyderabad" },
  { title: "In the lab", caption: "Spectroscopy and device fabrication" },
  { title: "Outreach", caption: "Teaching science to school students" },
  { title: "Cricket", caption: "All India Inter-NIT Tournament" },
  { title: "TIFR Hyderabad", caption: "Campus and colleagues" },
  { title: "Nature", caption: "Landscapes and the outdoors" }
];

/* =====================================================================
   END OF CONTENT. Everything below builds the page; no need to edit it.
   ===================================================================== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bold = s => esc(s).split(esc(SITE.authorName)).join("<b>" + esc(SITE.authorName) + "</b>");
const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`;
const has = a => Array.isArray(a) && a.length > 0;
const sections = [];
const add = (id, label, html) => sections.push({ id, label, html });

document.getElementById("brand").textContent = SITE.name;
document.getElementById("tag").innerHTML = esc(SITE.tagline).replace(/, /g, ",<br>");
document.getElementById("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

if (has(RESEARCH.interests) || RESEARCH.text) {
  add("research", "Research",
    `<h2>Research</h2><p class="lead">${esc(RESEARCH.text)}</p>` +
    (has(RESEARCH.interests) ? `<h3 class="sub">Research interests</h3><div class="grid">${RESEARCH.interests.map(i => `<div class="card"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join("")}</div>` : ""));
}

const list = a => `<ul class="list">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
let cv = "<h2>CV</h2>";
if (has(EDUCATION)) cv += `<h3 class="sub">Education</h3>` + EDUCATION.map(e => `<div class="row"><span class="yr">${esc(e.years)}</span><div><b>${esc(e.degree)}</b>, ${esc(e.place)}${e.score ? `<small>${esc(e.score)}</small>` : ""}</div></div>`).join("");
if (has(SKILLS)) cv += `<h3 class="sub">Technical skills</h3><div class="grid">${SKILLS.map(i => `<div class="card"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join("")}</div>`;
if (has(TALKS)) cv += `<h3 class="sub">Conferences and invited talks</h3>` + list(TALKS);
if (has(AWARDS)) cv += `<h3 class="sub">Awards and achievements</h3>` + list(AWARDS);
if (has(OUTREACH)) cv += `<h3 class="sub">Outreach and activities</h3>` + list(OUTREACH);
if (cv.length > 12) add("cv", "CV", cv);

if (has(PUBLICATIONS)) {
  add("publications", "Publications",
    `<h2>Publications</h2>` + (SITE.scholar ? `<p class="lead">${link(SITE.scholar, "Full list on Google Scholar")}</p>` : "") +
    PUBLICATIONS.filter(g => has(g.items)).map(g => `<h3 class="sub">${esc(g.group)}</h3>` + g.items.map(p => {
      const meta = [p.journal ? `<i>${esc(p.journal)}</i>` : "", p.detail ? esc(p.detail) : ""].filter(Boolean).join(" ") + (p.link ? (p.journal || p.detail ? " · " : "") + link(p.link, "DOI") : "");
      return `<div class="pub"><b>${esc(p.title)}</b><span>${p.authors ? bold(p.authors) + "<br>" : ""}${meta}</span></div>`;
    }).join("")).join(""));
}

if (has(GALLERY)) {
  add("gallery", "Gallery", `<h2>Gallery</h2><div class="gal">${GALLERY.map(g => `<figure>${g.file ? `<img src="${esc(g.file)}" alt="${esc(g.title || g.caption)}" loading="lazy">` : `<div class="ph">${esc(g.title)}</div>`}<figcaption>${esc(g.caption || "")}</figcaption></figure>`).join("")}</div>`);
}

add("contact", "Contact",
  `<h2>Contact</h2><p class="lead contact">${esc(SITE.name)}<br>${esc(SITE.tagline.replace(/^PhD Physics, /, ""))}</p><p class="contact">` +
  (SITE.email ? `<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a><br>` : "") + (SITE.scholar ? link(SITE.scholar, "Google Scholar") : "") + `</p>`);

const hero = `<div class="hero" id="home"><div class="hero-in" id="heroin">` +
  (SITE.photo ? `<img class="photo" id="photo" src="${esc(SITE.photo)}" alt="${esc(SITE.photoAlt)}">` : "") +
  `<div class="hero-text"><h1>${esc(SITE.heading)}</h1><div class="creds">${SITE.credentials.map(esc).join("<br>")}</div>${SITE.intro.map(p => `<p>${esc(p)}</p>`).join("")}</div></div></div>`;

document.getElementById("main").innerHTML = hero + sections.map(s => `<section id="${s.id}">${s.html}</section>`).join("");
document.getElementById("nav").innerHTML = `<a href="#home">Home</a>` + sections.map(s => `<a href="#${s.id}">${s.label}</a>`).join("");

const ph = document.getElementById("photo");
if (ph) ph.addEventListener("error", () => { ph.remove(); document.getElementById("heroin").classList.add("nophoto"); });
</script>
